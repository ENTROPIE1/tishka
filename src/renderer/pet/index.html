<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file: data:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тишка</title>
    <link rel="stylesheet" href="./pet.css" />
    <link rel="stylesheet" href="./svg-hedgehog.css" />
  </head>
  <body>
    <div id="pet" class="pet">
      <div id="bubble" class="bubble" hidden>
        <div id="say" class="say"></div>
        <form id="composer" class="composer" hidden>
          <input
            id="input"
            class="composer-input"
            type="text"
            placeholder="Написать Тишке…"
            autocomplete="off"
          />
        </form>
      </div>
      <div id="card-host" class="card-host" hidden></div>
      <div id="character" class="character">
        <span id="state" class="state-label"></span>
      </div>
    </div>
    <script type="module" src="./pet.ts"></script>
  </body>
</html>
